name: Terraform CI/CD

on:
  push:
    branches:
      - master
      - Dev
  pull_request:
    branches:
      - master
      - Dev

permissions:
  contents: read

concurrency:
  group: terraform-${{ (github.base_ref || github.ref_name) == 'master' && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform (${{ (github.base_ref || github.ref_name) == 'master' && 'prod' || 'dev' }})
    runs-on: ubuntu-latest
    environment: ${{ (github.base_ref || github.ref_name) == 'master' && 'Production' || 'Development' }}

    defaults:
      run:
        working-directory: terraformLearn

    env:
      ARM_CLIENT_ID: ${{ secrets.ARM_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.ARM_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.ARM_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.ARM_TENANT_ID }}
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: true
      TF_INPUT: false

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-terraform-meta" \
            -backend-config="storage_account_name=amallokstorage" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=client-a-${{ (github.base_ref || github.ref_name) == 'master' && 'prod' || 'dev' }}.terraform.tfstate"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          terraform plan \
            -no-color \
            -var-file="${{ (github.base_ref || github.ref_name) == 'master' && 'prod' || 'dev' }}.tfvars" \
            -out=tfplan

      - name: Terraform apply
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/Dev')
        run: terraform apply -auto-approve tfplan
