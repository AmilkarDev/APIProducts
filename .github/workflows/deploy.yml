name: Deploy .NET 8 API to Azure

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Terraform CI/CD
    types:
      - completed
    branches:
      - master
      - Dev

permissions:
  contents: read
  id-token: write

concurrency:
  group: api-deploy-${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'prod' || 'dev' }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and deploy (${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'prod' || 'dev' }})
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'Production' || 'Development' }}

    env:
      AZURE_WEBAPP_NAME: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name) == 'master' && 'app-client-a-dotnet-api-prod' || 'app-client-a-dotnet-api-dev' }}

    steps:
      - name: Download Source Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Run Unit Tests
        run: |
          cd webApiLearn
          dotnet test

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=AmilkarDev_APIProducts
            -Dsonar.organization=amilkardev
            -Dsonar.sources=webApiLearn/ClientA.Api

      - name: Build and Publish
        run: |
          cd webApiLearn/ClientA.Api
          dotnet publish -c Release -o ../publish

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ARM_CLIENT_ID }}
          tenant-id: ${{ secrets.ARM_TENANT_ID }}
          subscription-id: ${{ secrets.ARM_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: './webApiLearn/publish'
